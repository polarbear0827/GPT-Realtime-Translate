name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check JavaScript syntax
        run: npm run check

      - name: Unit, server and session tests
        run: npm test

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install wrangler
        run: npm ci --prefix relay --no-audit --no-fund

      - name: Relay end-to-end tests (wrangler dev)
        timeout-minutes: 5
        run: npm run relay:test

      - name: Load test (300 simulated viewers)
        timeout-minutes: 5
        run: npm run relay:load-test -- --viewers 300 --seconds 10 --ramp 3

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Tests (includes the Swift ↔ Node contract test)
        run: npm test

      - name: macOS bridge test (offscreen WKWebView)
        run: npm run test:macos

      - name: Build universal app and pkg
        run: npm run build:pkg
