plugins {
    id "com.android.application"
}

// Version comes from the repository's VERSION file (single source of truth).
def appVersion = rootProject.file("../VERSION").text.trim()
def versionParts = appVersion.tokenize(".").collect { it as int }
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// Release signing uses a stable keystore provided through environment variables (GitHub secrets),
// so installed apps can be upgraded in place. See README "Android release signing".
def releaseKeystore = System.getenv("ANDROID_KEYSTORE_FILE")

android {
    namespace "local.keynotelivetranslator"
    compileSdk 35

    defaultConfig {
        applicationId "local.keynotelivetranslator"
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ["../../public"]
        }
    }
}
