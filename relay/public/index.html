<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111311" />
    <meta name="robots" content="noindex" />
    <title>即時翻譯</title>
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/viewer.css" />
  </head>
  <body>
    <main class="landing">
      <div class="landing-card">
        <img class="landing-logo" src="/logo-256.png" alt="" width="72" height="72" />
        <h1>即時翻譯</h1>
        <p>掃描現場的 QR Code 就能觀看。也可以輸入講者提供的分享代碼：</p>
        <form action="/go" method="get">
          <input name="code" inputmode="latin" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="分享代碼" aria-label="分享代碼" required />
          <button type="submit">前往</button>
        </form>
      </div>
    </main>
  </body>
</html>
